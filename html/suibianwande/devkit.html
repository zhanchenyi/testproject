    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    var h = 0, s = 0, l = (max + min) / 2;
    if (d !== 0) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }
  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var arr = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
      : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return arr.map(function (v) { return Math.round((v + m) * 255); });
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (v) {
      return Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0');
    }).join('').toUpperCase();
  }

  function uuidv4() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  var ACTIONS = {
    json: function () {
      var raw = inputEl.value.trim();
      if (!raw) { write('', ''); setStatus('等待输入', true); return; }
      var obj;
      try { obj = JSON.parse(raw); }
      catch (e) {
        var m = /position (\d+)/.exec(e.message);
        var hint = m ? '（字符 ' + m[1] + ' 附近）' : '';
        write('', '<span style="color:var(--danger)">✗ ' + escapeHtml(e.message) + hint + '</span>');
        setStatus('解析失败', false);
        return;
      }
      var indent = $('indent').value === 'min' ? 0 : Number($('indent').value);
      var text = JSON.stringify(obj, null, indent);
      write(text, highlightJson(text));
      setStatus('✓ 校验通过', true);
    },

    regex: function () {
      var text = inputEl.value;
      if (!inputPattern().trim()) { write(text); setStatus('请输入表达式', false); return; }
      try {
        var result = highlightMatches(text, getFlags());
        write(text, result.html || '<span style="color:var(--dim)">(空输出)</span>');
        setStatus('✓ ' + result.count + ' 处匹配', true);
      } catch (e) {
        write('', '<span style="color:var(--danger)">✗ ' + escapeHtml(e.message) + '</span>');
        setStatus('表达式错误', false);
      }
    },

    base64: function () {
      var raw = inputEl.value;
      if (!raw) { write(''); setStatus('等待输入', true); return; }
      var mode = $('b64mode').value;
      try {
        var enc = new TextEncoder(), dec = new TextDecoder('utf-8', { fatal: true });
        var text;
        if (mode === 'encode') {
          var bytes = enc.encode(raw);
          var bin = '';
          for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          text = btoa(bin);
        } else {
          var bin2 = atob(raw.replace(/\s/g, ''));
          var arr = new Uint8Array(bin2.length);
          for (var j = 0; j < bin2.length; j++) arr[j] = bin2.charCodeAt(j);
          text = dec.decode(arr);
        }
        write(text);
        setStatus('✓ ' + (mode === 'encode' ? '编码' : '解码') + '完成', true);
      } catch (e) {
        write('', '<span style="color:var(--danger)">✗ 无效的 ' + (mode === 'encode' ? '输入' : 'Base64 字符串') + '</span>');
        setStatus('转换失败', false);
      }
    },

    url: function () {
      var raw = inputEl.value;
      if (!raw) { write(''); setStatus('等待输入', true); return; }
      var mode = $('urlmode').value;
      try {
        var text = mode === 'encode' ? encodeURIComponent(raw) : decodeURIComponent(raw);
        write(text);
        setStatus('✓ ' + (mode === 'encode' ? '编码' : '解码') + '完成', true);
      } catch (e) {
        write('', '<span style="color:var(--danger)">✗ ' + escapeHtml(e.message) + '</span>');
        setStatus('转换失败', false);
      }
    },

    time: function () {
      var raw = inputEl.value.trim();
      if (!raw) { write(''); setStatus('等待输入', true); return; }
      var mode = $('timemode').value, text;
      try {
        if (mode === 'toDate') {
          if (!/^\d+$/.test(raw)) throw new Error('请输入纯数字时间戳');
          var ms = raw.length <= 10 ? Number(raw) * 1000 : Number(raw);
          var d = new Date(ms);
          if (isNaN(d.getTime())) throw new Error('超出有效日期范围');
          text = '本地时间  ' + d.toString() + '\n'
               + 'ISO 8601   ' + d.toISOString() + '\n'
               + 'UTC 时间   ' + d.toUTCString() + '\n'
               + '日期       ' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        } else {
          var d2 = new Date(raw);
          if (isNaN(d2.getTime())) throw new Error('无法解析该日期字符串');
          text = '秒级时间戳  ' + Math.floor(d2.getTime() / 1000) + '\n'
               + '毫秒时间戳  ' + d2.getTime() + '\n'
               + '解析结果    ' + d2.toISOString();
        }
        write(text);
        setStatus('✓ 转换完成', true);
      } catch (e) {
        write('', '<span style="color:var(--danger)">✗ ' + escapeHtml(e.message) + '</span>');
        setStatus('转换失败', false);
      }
    },

    color: function () {
      var raw = inputEl.value.trim();
      if (!raw) { write(''); setStatus('等待输入', true); return; }
      var rgb = null;
      var hex = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(raw);
      if (hex) rgb = hexToRgb(hex[1]);
      var rm = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(raw);
      if (rm) rgb = [+rm[1], +rm[2], +rm[3]];
      var hm = /^hsla?\(\s*(\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)%?[,\s]+(\d+(?:\.\d+)?)%?/i.exec(raw);
      if (hm) rgb = hslToRgb(+hm[1], +hm[2], +hm[3]);
      if (!rgb || rgb.some(function (v) { return v < 0 || v > 255 || isNaN(v); })) {
        write('', '<span style="color:var(--danger)">✗ 无法识别的颜色格式（支持 #RGB / #RRGGBB / rgb() / hsl()）</span>');
        setStatus('解析失败', false);
        return;
      }
      var hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
      var hexOut = toHex(rgb);
      outputText = hexOut + '\nrgb(' + rgb.join(', ') + ')\nhsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
      outputEl.innerHTML =
        '<div class="color-row"><b>HEX</b><span class="swatch" style="background:' + hexOut + '"></span>' + hexOut + '</div>'
        + '<div class="color-row"><b>RGB</b><span class="swatch" style="background:rgb(' + rgb.join(',') + ')"></span>rgb(' + rgb.join(', ') + ')</div>'
        + '<div class="color-row"><b>HSL</b><span class="swatch" style="background:hsl(' + hsl.join(',') + ')"></span>hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)</div>'
        + '<div style="height:56px;border-radius:8px;margin-top:12px;background:linear-gradient(90deg,' + hexOut + ',transparent);border:1px solid var(--border)"></div>';
      $('outputStat').textContent = '3 种格式';
      setStatus('✓ 转换完成', true);
    },

    uuid: function () {
      var n = Math.min(Math.max(Number($('uuidCount').value) || 1, 1), 100);
      var lines = [];
      for (var i = 0; i < n; i++) lines.push(uuidv4());
      var text = lines.join('\n');
      write(text);
      setStatus('✓ 已生成 ' + n + ' 个', true);
    }
  };

  var OPTIONS = {
    json: function () {
      return '<div class="field"><label>缩进</label><select id="indent">'
        + '<option value="2">2 空格</option><option value="4">4 空格</option><option value="min">压缩</option></select></div>'
        + '<button class="btn btn-primary" data-run>格式化</button>';
    },
    regex: function () {
      return '<div class="field grow"><label>表达式</label><input type="text" class="grow" id="pattern" placeholder="例如 \\b\\w+@\\w+\\.\\w+\\b" value=""></div>'
        + '<div class="checks">'
        + ['g', 'i', 'm', 's'].map(function (f) {
            return '<label class="check"><input type="checkbox" id="flag-' + f + '"' + (f === 'g' ? ' checked' : '') + '>' + f + '</label>';
          }).join('')
        + '</div><button class="btn btn-primary" data-run>匹配</button>';
    },
    base64: function () {
      return '<div class="field"><label>操作</label><select id="b64mode"><option value="encode">编码</option><option value="decode">解码</option></select></div>'
        + '<button class="btn btn-primary" data-run>执行</button>';
    },
    url: function () {
      return '<div class="field"><label>操作</label><select id="urlmode"><option value="encode">编码</option><option value="decode">解码</option></select></div>'
        + '<button class="btn btn-primary" data-run>执行</button>';
    },
    time: function () {
      return '<div class="field"><label>操作</label><select id="timemode"><option value="toDate">时间戳 → 日期</option><option value="toStamp">日期 → 时间戳</option></select></div>'
        + '<button class="btn btn-primary" data-run>转换</button>'
        + '<button class="btn" id="nowBtn">填入当前时间</button>';
    },
    color: function () {
      return '<span style="color:var(--dim);font-size:11px">输入 #1A7F37 / rgb(26,127,55) / hsl(142,66%,30%)，自动识别</span>'
        + '<button class="btn btn-primary" data-run style="margin-left:auto">转换</button>';
    },
    uuid: function () {
      return '<div class="field"><label>数量</label><input type="number" id="uuidCount" value="5" min="1" max="100"></div>'
        + '<button class="btn btn-primary" data-run>生成</button>';
    }
  };

  var PREFILL = {
    json: '{"name":"DevKit","version":1,"features":["local","zero-dependency","fast"],"ready":true}',
    regex: 'hello dev@example.com\nworld test@domain.org\ninvalid@@mail',
    base64: 'Hello, 世界！',
    url: 'https://example.com/search?q=你好 world&page=1',
    time: '1735689600',
    color: '#58A6FF',
    uuid: ''
  };

  function buildNav() {
    $('nav').innerHTML = TOOLS.map(function (t) {
      var icon = t.ico
        ? '<svg viewBox="0 0 24 24">' + t.ico + '</svg>'
        : '<span class="ico-text">64</span>';
      return '<button class="nav-item" data-id="' + t.id + '">' + icon + '<span class="name">' + t.name + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (b) {
      b.addEventListener('click', function () { select(b.dataset.id); });
    });
  }

  function select(id) {
    current = id;
    var tool = TOOLS.filter(function (t) { return t.id === id; })[0];
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (b) {
      b.classList.toggle('active', b.dataset.id === id);
    });
    $('toolTitle').textContent = tool.title;
    $('toolDesc').textContent = tool.desc;
    $('options').innerHTML = OPTIONS[id]();
    inputEl.value = PREFILL[id];
    updateInputStat();

    Array.prototype.forEach.call($('options').querySelectorAll('[data-run]'), function (b) {
      b.addEventListener('click', function () { ACTIONS[id](); });
    });
    Array.prototype.forEach.call($('options').querySelectorAll('select, input'), function (el) {
      el.addEventListener('change', function () { ACTIONS[id](); });
    });
    if (id === 'time') {
      $('nowBtn').addEventListener('click', function () {
        inputEl.value = String(Math.floor(Date.now() / 1000));
        updateInputStat();
        ACTIONS.time();
      });
    }
    if (id === 'regex') {
      $('pattern').addEventListener('input', function () { ACTIONS.regex(); });
    }
    ACTIONS[id]();
  }

  inputEl.addEventListener('input', function () {
    updateInputStat();
    ACTIONS[current]();
  });

  $('clearBtn').addEventListener('click', function () {
    inputEl.value = '';
    updateInputStat();
    write('', '');
    setStatus('等待输入', true);
    inputEl.focus();
  });

  $('pasteBtn').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      setStatus('浏览器不支持读取剪贴板', false);
      return;
    }
    navigator.clipboard.readText().then(function (text) {
      inputEl.value = text;
      updateInputStat();
      ACTIONS[current]();
      setStatus('✓ 已粘贴', true);
    }).catch(function () { setStatus('剪贴板读取被拒绝', false); });
  });

  $('copyBtn').addEventListener('click', function () {
    if (!outputText) { setStatus('没有可复制的内容', false); return; }
    navigator.clipboard.writeText(outputText).then(function () {
      var old = $('copyBtn').textContent;
      $('copyBtn').textContent = '已复制 ✓';
      setTimeout(function () { $('copyBtn').textContent = old; }, 1400);
    }).catch(function () { setStatus('复制失败，请手动选择', false); });
  });

  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter') { e.preventDefault(); ACTIONS[current](); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('clearBtn').click(); }
  });

  $('themeToggle').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('devkit-theme', next);
    $('themeIcon').innerHTML = next === 'dark'
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  });

  var saved = localStorage.getItem('devkit-theme');
  if (saved === 'light') $('themeToggle').click();

  buildNav();
  select('json');
})();
</script>
</body>
</html>
