<script data-page-node-id="YXdzIeV85CrqhrenZcYIMo" data-pnid-children="PKseqeU0Pvmgkyte8LsF8P">
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var inputEl = $('input'), inputBEl = $('inputB'), outputEl = $('output'), statusEl = $('status');
  var current = 'json', outputText = '';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = ok ? 'status-ok' : 'status-err';
  }
  function write(text, html) {
    outputText = text == null ? '' : String(text);
    var h = html === undefined ? escapeHtml(outputText) : html;
    outputEl.innerHTML = /^\s*<(pre|div|h[1-6]|ul|ol|blockquote|table)/i.test(h) ? h : '<pre>' + h + '</pre>';
    $('outputStat').textContent = outputText.length + ' 字符';
  }
  function fail(msg) {
    write('', '<span style="color:var(--danger)">✗ ' + escapeHtml(msg) + '</span>');
    setStatus('失败', false);
  }
  function inputVal() { return inputEl.value; }
  function inputBVal() { return inputBEl.value; }
  function opt(id) {
    var el = $(id);
    if (!el) return null;
    return el.type === 'checkbox' ? el.checked : el.value;
  }
  function stat(s) { return s.length + ' 字符 · ' + (s ? s.split('\n').length : 0) + ' 行'; }
  function updateInputStat() {
    var extra = inputBEl.classList.contains('hidden') ? '' : '　│　B: ' + stat(inputBVal());
    $('inputStat').textContent = stat(inputVal()) + extra;
  }

  function highlightJson(str) {
    var re = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g;
    var out = '', last = 0, m;
    while ((m = re.exec(str)) !== null) {
      out += escapeHtml(str.slice(last, m.index));
      if (m[1]) {
        out += '<span class="' + (m[2] ? 'tok-key' : 'tok-str') + '">' + escapeHtml(m[1]) + '</span>';
        if (m[2]) out += escapeHtml(m[2]);
      } else if (m[3]) out += '<span class="tok-num">' + escapeHtml(m[3]) + '</span>';
      else if (m[4]) out += '<span class="tok-bool">' + escapeHtml(m[4]) + '</span>';
      last = re.lastIndex;
    }
    return out + escapeHtml(str.slice(last));
  }

  /* ---------- 工具实现 ---------- */

  function runJson() {
    var raw = inputVal().trim();
    if (!raw) { write('', ''); setStatus('等待输入', true); return; }
    var obj;
    try { obj = JSON.parse(raw); }
    catch (e) {
      var m = /position (\d+)/.exec(e.message);
      fail(e.message + (m ? '（字符 ' + m[1] + ' 附近）' : ''));
      return;
    }
    var size = opt('indent') === 'min' ? 0 : Number(opt('indent'));
    var text = JSON.stringify(obj, null, size);
    write(text, highlightJson(text));
    setStatus('✓ 校验通过', true);
  }

  function runRegex() {
    var text = inputVal(), pattern = opt('pattern') || '';
    if (!pattern.trim()) { write(text); setStatus('请输入表达式', false); return; }
    var flags = '';
    ['g', 'i', 'm', 's'].forEach(function (f) { if (opt('flag-' + f)) flags += f; });
    try {
      var re = new RegExp(pattern, flags);
      var g = new RegExp(re.source, flags.indexOf('g') === -1 ? flags + 'g' : flags);
      var out = '', last = 0, m, count = 0;
      while ((m = g.exec(text)) !== null) {
        if (m[0] === '') { g.lastIndex++; continue; }
        out += escapeHtml(text.slice(last, m.index)) + '<mark>' + escapeHtml(m[0]) + '</mark>';
        last = m.index + m[0].length;
        count++;
        if (count > 2000) break;
      }
      out += escapeHtml(text.slice(last));
      write(text, out || '<span style="color:var(--dim)">(空输出)</span>');
      setStatus('✓ ' + count + ' 处匹配', true);
    } catch (e) { fail(e.message); }
  }

  function runBase64() {
    var raw = inputVal();
    if (!raw) { write(''); setStatus('等待输入', true); return; }
    try {
      var text;
      if (opt('b64mode') === 'encode') {
        var bytes = new TextEncoder().encode(raw), bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        text = btoa(bin);
      } else {
        var bin2 = atob(raw.replace(/\s/g, '')), arr = new Uint8Array(bin2.length);
        for (var j = 0; j < bin2.length; j++) arr[j] = bin2.charCodeAt(j);
        text = new TextDecoder('utf-8', { fatal: true }).decode(arr);
      }
      write(text);
      setStatus('✓ 转换完成', true);
    } catch (e) { fail('无效的 Base64 输入'); }
  }

  function runUrl() {
    var raw = inputVal();
    if (!raw) { write(''); setStatus('等待输入', true); return; }
    try {
      var text = opt('urlmode') === 'encode' ? encodeURIComponent(raw) : decodeURIComponent(raw);
      write(text); setStatus('✓ 转换完成', true);

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    var h = 0, s = 0, l = (max + min) / 2;
    if (d !== 0) {
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }
  function hslToRgb(h, s, l) {

    var m = l - c / 2;
    var arr = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]

  }

  function runJson2Ts() {
    var raw = inputVal().trim();
    if (!raw) { write(''); setStatus('等待输入', true); return; }
    var obj;
    try { obj = JSON.parse(raw); }
    catch (e) { fail(e.message); return; }
    var root = (opt('tsName') || 'Root').replace(/[^A-Za-z0-9_$]/g, '') || 'Root';
    var defs = [], used = {};
    function safeKey(k) { return /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k); }
    function unique(base) {
      var name = base, i = 1;
      while (used[name]) name = base + i++;
      used[name] = 1;
      return name;
    }
    function typeOf(v, key) {
      if (v === null) return 'null';
      if (Array.isArray(v)) {
        if (!v.length) return 'any[]';
        var types = [];
        v.slice(0, 20).forEach(function (item) {
          var t = typeOf(item, key);
          if (types.indexOf(t) === -1) types.push(t);
        });
        return types.length === 1 ? types[0] + '[]' : '(' + types.join(' | ') + ')[]';
      }
      if (typeof v === 'object') {
        var name = unique(key.replace(/[^A-Za-z0-9]/g, '') || 'Item');
        defs.push({ name: name, obj: v });
        return name;
      }
      return typeof v;
    }
    function render(name, o) {
      var lines = ['interface ' + name + ' {'];
      Object.keys(o).forEach(function (k) {
        var v = o[k];
        lines.push('  ' + safeKey(k) + ': ' + typeOf(v, k) + ';');
      });
      lines.push('}');
      return lines;
    }
    used[root] = 1;
    var out = render(root, obj);
    var guard = 0;
    while (defs.length && guard++ < 100) {
      var d = defs.shift();
      out.push('');
      out = out.concat(render(d.name, d.obj));
    }
    var text = out.join('\n');
    write(text, highlightJson(text));
    setStatus('✓ 已生成 interface', true);
  }

  function runJwt() {
    var raw = inputVal().trim();
    if (!raw) { write(''); setStatus('等待输入', true); return; }
    var parts = raw.split('.');
    if (parts.length !== 3) { fail('JWT 应为 header.payload.signature 三段式'); return; }
    try {
      function decode(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        var bin = atob(s), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));

      var header = decode(parts[0]), payload = decode(parts[1]);
      var hText = JSON.stringify(header, null, 2), pText = JSON.stringify(payload, null, 2);
      outputText = 'HEADER\n' + hText + '\n\nPAYLOAD\n' + pText + '\n\nSIGNATURE\n' + parts[2];
      var extra = '';
      if (payload.exp) extra += '<div style="margin-top:12px;color:' + (payload.exp * 1000 < Date.now() ? 'var(--danger)' : 'var(--success)') + '">过期时间：' + new Date(payload.exp * 1000).toLocaleString() + (payload.exp * 1000 < Date.now() ? '（已过期）' : '') + '</div>';
      if (payload.iat) extra += '<div style="color:var(--dim)">签发时间：' + new Date(payload.iat * 1000).toLocaleString() + '</div>';
      outputEl.innerHTML =
        '<div style="color:var(--dim);font-size:10px;margin-bottom:4px">HEADER</div><pre>' + highlightJson(hText) + '</pre>'

        + '<div style="color:var(--dim);font-size:10px;margin:12px 0 4px">SIGNATURE</div><pre>' + escapeHtml(parts[2]) + '</pre>' + extra;
      $('outputStat').textContent = outputText.length + ' 字符';
      setStatus('✓ 解码成功（未验签）', true);

  function runDiff() {
    var a = inputVal(), b = inputBVal();
    var A = a.split('\n'), B = b.split('\n');
    if (A.length * B.length > 400000) { fail('文本过大，Diff 上限约 600×600 行'); return; }
    var n = A.length, m = B.length, dp = [], i, j;
    for (i = 0; i <= n; i++) dp[i] = new Uint32Array(m + 1);
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) {
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    var rows = [], added = 0, removed = 0;
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { rows.push([' ', A[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { rows.push(['-', A[i]]); removed++; i++; }
      else { rows.push(['+', B[j]]); added++; j++; }
    }
    while (i < n) { rows.push(['-', A[i++]]); removed++; }
    while (j < m) { rows.push(['+', B[j++]]); added++; }
    outputText = rows.map(function (r) { return r[0] + ' ' + r[1]; }).join('\n');
    var html = rows.map(function (r) {
      var cls = r[0] === '+' ? 'diff-add' : r[0] === '-' ? 'diff-del' : 'diff-same';
      return '<span class="' + cls + '">' + escapeHtml(r[0] + ' ' + r[1]) + '</span>';
    }).join('');
    write(outputText, '<pre>' + html + '</pre>');
    setStatus('✓ +' + added + ' / -' + removed, true);
  }

  function runNaming() {

  function runHash() {

      write(hex); setStatus('✓ ' + algo, true);

  }

      options:function(){return '<div class="field"><label>表达式</label><input type="text" class="grow" id="pattern" placeholder="\\b\\w+@\\w+\\.\\w+\\b" value="\\b\\w+@\\w+\\.\\w+\\b"></div><div class="checks">' + ['g','i','m','s'].map(function(f){return '<label class="check"><input type="checkbox" id="flag-'+f+'"'+(f==='g'?' checked':'')+'>'+f+'</label>';}).join('') + '</div><button class="btn btn-primary" data-run>匹配</button>';} },

  ];

  /* ---------- 框架 ---------- */

  function buildNav() {
    var groups = {};
    TOOLS.forEach(function (t) { (groups[t.group] = groups[t.group] || []).push(t); });
    var html = '';
    Object.keys(groups).forEach(function (g) {
      html += '<div class="nav-label">' + g + '</div>';
      groups[g].forEach(function (t) {
        var icon = t.ico ? '<svg viewBox="0 0 24 24">' + t.ico + '</svg>' : '<span class="ico-text">' + t.text + '</span>';
        html += '<button class="nav-item" data-id="' + t.id + '">' + icon + '<span class="name">' + t.name + '</span></button>';
      });
    });
    $('nav').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (b) {
      b.addEventListener('click', function () { select(b.dataset.id); });
    });
  }

  function activeTool() {
    return TOOLS.filter(function (t) { return t.id === current; })[0];
  }
  function select(id) {
    current = id;
    var tool = activeTool();
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (b) {
      b.classList.toggle('active', b.dataset.id === id);
    });
    $('toolTitle').textContent = tool.title;
    $('toolDesc').textContent = tool.desc;
    $('inputLabelA').textContent = tool.dual ? '原文 A' : '输入';
    inputBEl.classList.toggle('hidden', !tool.dual);
    $('options').innerHTML = tool.options();
    inputEl.value = tool.prefill;
    inputBEl.value = tool.prefillB || '';
    updateInputStat();

    Array.prototype.forEach.call($('options').querySelectorAll('[data-run]'), function (b) {
      b.addEventListener('click', function () { tool.run(); });
    });
    Array.prototype.forEach.call($('options').querySelectorAll('select, input[type="number"], input[type="text"]'), function (el) {
      el.addEventListener('change', function () { tool.run(); });
    });
    if (id === 'time') {
      $('nowBtn').addEventListener('click', function () {
        inputEl.value = String(Math.floor(Date.now() / 1000));
        updateInputStat(); tool.run();
      });
    }
    if (id === 'regex') {
      $('pattern').addEventListener('input', function () { tool.run(); });
    }
    tool.run();
  }

  function onInput() { updateInputStat(); activeTool().run(); }
  [inputEl, inputBEl].forEach(function (el) { el.addEventListener('input', onInput); });

  $('clearBtn').addEventListener('click', function () {
    inputEl.value = ''; inputBEl.value = '';
    updateInputStat(); write('', ''); setStatus('等待输入', true); inputEl.focus();
  });
  $('pasteBtn').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { setStatus('浏览器不支持读取剪贴板', false); return; }
    navigator.clipboard.readText().then(function (text) {
      inputEl.value = text; updateInputStat(); activeTool().run();
      setStatus('✓ 已粘贴', true);
    }).catch(function () { setStatus('剪贴板读取被拒绝', false); });
  });
  $('copyBtn').addEventListener('click', function () {
    if (!outputText) { setStatus('没有可复制的内容', false); return; }
    navigator.clipboard.writeText(outputText).then(function () {
      var old = $('copyBtn').textContent;
      $('copyBtn').textContent = '已复制 ✓';
      setTimeout(function () { $('copyBtn').textContent = old; }, 1400);
    }).catch(function () { setStatus('复制失败，请手动选择', false); });
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter') { e.preventDefault(); activeTool().run(); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('clearBtn').click(); }
  });
  $('themeToggle').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('devkit-theme', next);
    $('themeIcon').innerHTML = next === 'dark'
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  });
  if (localStorage.getItem('devkit-theme') === 'light') $('themeToggle').click();

  buildNav();
  select('json');
})();
</script>
